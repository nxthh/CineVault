<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Title Details — CineVault</title>
    <meta
      name="description"
      content="Cast, crew, episodes and recommendations."
    />
    <link rel="canonical" href="https://example.com/details.html" />
    <meta property="og:title" content="Title Details — CineVault" />
    <meta
      property="og:description"
      content="Cast, crew, episodes and recommendations."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      try {
        var t = localStorage.getItem("cv-theme");
        if (
          t
            ? t === "light"
            : matchMedia("(prefers-color-scheme: light)").matches
        )
          document.documentElement.classList.remove("dark");
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="dist/styles.css" />
    <script type="module" src="dist/main.js" defer></script>
  </head>
  <body
    data-page="details"
    class="bg-zinc-50 text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100 min-h-screen"
  >
    <header id="nav"></header>
    <h1 class="sr-only">Details — CineVault</h1>
    <main>
      <section id="s1" aria-labelledby="h1" class="">
        <h2 id="h1" class="sr-only">Title Overview</h2>
        <div id="c1"></div>
      </section>

      <!-- NEW: Season & Episode Section (Hidden for movies by default) -->
      <section id="s-episodes" aria-labelledby="h-episodes" class="mx-auto max-w-7xl px-4 py-8 hidden">
        <div class="mb-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
          <h2 id="h-episodes" class="text-2xl font-bold">Episodes</h2>
          <select id="season-select" class="rounded bg-zinc-900 px-3 py-2 text-sm text-zinc-100 border border-zinc-800 focus:outline-none focus:border-accent">
            <!-- Populated via JS -->
          </select>
        </div>
        <div id="episodes-list" class="grid grid-cols-1 gap-4 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4"></div>
      </section>

      <section id="s2" aria-labelledby="h2" class="mx-auto max-w-7xl px-4 py-8">
        <h2 id="h2" class="mb-4 text-2xl font-bold">Cast & Crew</h2>
        <div id="c2"></div>
      </section>
      <section id="s3" aria-labelledby="h3" class="mx-auto max-w-7xl px-4 py-8">
        <h2 id="h3" class="mb-4 text-2xl font-bold">More Like This</h2>
        <div id="c3"></div>
      </section>
    </main>
    <footer id="footer"></footer>
  </body>
</html>
